<script src="content-index.js"></script>
<script>
(async function () {
  var el = document.getElementById('lista');
  var LUNI = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Noi','Dec'];

  function dataScurta(s) {
    var d = new Date(s);
    if (isNaN(d)) return s || '';
    return LUNI[d.getMonth()] + ' ' + d.getFullYear();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function frontMatter(text) {
    var m = /^---\s*\n([\s\S]*?)\n---/.exec(text);
    var meta = {};
    if (!m) return meta;
    m[1].split('\n').forEach(function (linie) {
      var i = linie.indexOf(':');
      if (i < 0) return;
      var k = linie.slice(0, i).trim();
      var v = linie.slice(i + 1).trim().replace(/^["']|["']$/g, '');
      meta[k] = v;
    });
    return meta;
  }

  var articole = [];
  try {
    var fisiere = (window.CYBERSCUT_ARTICLES || []).slice();
    var rezultate = await Promise.all(fisiere.map(async function (nume) {
      var r = await fetch('content/blog/' + nume, { cache: 'no-cache' });
      if (!r.ok) return null;
      var meta = frontMatter(await r.text());
      if (String(meta.draft) === 'true') return null;
      meta.slug = nume.replace(/\.md$/, '');
      return meta;
    }));
    articole = rezultate.filter(Boolean);
  } catch (e) {
    articole = [];
  }

  articole.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });

  if (!articole.length) {
    el.innerHTML = '<div style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:rgba(233,233,237,0.5)">Niciun articol publicat încă.</div>';
    return;
  }

  el.innerHTML = articole.map(function (a) {
    return '<div class="card elev-sm">'
      + (a.category ? '<div class="card-kicker">' + esc(a.category) + '</div>' : '')
      + '<div class="card-title">' + esc(a.title) + '</div>'
      + '<p class="card-body">' + esc(a.summary) + '</p>'
      + '<div class="card-meta" style="justify-content:space-between">'
      + '<span>' + esc(dataScurta(a.date)) + '</span>'
      + '<a href="post.html?slug=' + encodeURIComponent(a.slug) + '" style="text-decoration:none">Citește →</a>'
      + '</div></div>';
  }).join('');
})();
</script>
